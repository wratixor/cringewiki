<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пост · Кринжевики</title><link rel="stylesheet" href="forms.css"></head>
<body><main class="form-page"><form class="form-card" data-kind="article" data-coordinates="true"><h1>Новый пост</h1><label>Заголовок<input name="title" maxlength="128" required></label><label>Текст<textarea name="body" maxlength="100000" required placeholder="Текст, **жирный**, *курсив*. Внутренняя ссылка: [[post-id|название]], внешняя: [название](https://example.org)"></textarea></label><p>Стартовые координаты от 1 до 99. После публикации пользователи смогут двигать точку голосами.</p><div class="coordinate-grid">
<label>Кринж<input name="c0" type="number" min="1" max="99" value="50" required></label><label>База<input name="c1" type="number" min="1" max="99" value="50" required></label><label>Смешное<input name="c2" type="number" min="1" max="99" value="50" required></label><label>Серьёзное<input name="c3" type="number" min="1" max="99" value="50" required></label><label>Баян<input name="c4" type="number" min="1" max="99" value="50" required></label><label>Новинка<input name="c5" type="number" min="1" max="99" value="50" required></label></div><button type="submit">Опубликовать</button><p id="message"></p><div class="form-links"><a href="./">Отмена</a></div></form></main><script src="form.js" defer></script></body></html>
