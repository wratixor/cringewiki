<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пост · Кринжевики</title><link rel="stylesheet" href="forms.css"></head>
<body><main class="form-page"><form class="form-card" data-kind="article" data-coordinates="true"><h1>Новый пост</h1><label>Заголовок<input name="title" maxlength="128" required></label><label>Текст <small>необязательно</small><textarea name="body" maxlength="100000" placeholder="Текст, **жирный**, *курсив*. Внутренняя ссылка: [[post-id|название]], внешняя: [название](https://example.org)"></textarea></label><section class="tag-editor" aria-labelledby="tags-heading"><h2 id="tags-heading">Теги</h2><p>Автор и текущая точка добавятся автоматически. Остальные теги — те же ссылки на концепты.</p><div id="tag-list" class="tag-list" aria-live="polite"></div><label>Добавить тег<input id="tag-search" type="search" placeholder="Начните вводить название" autocomplete="off"></label><div id="tag-suggestions" class="tag-suggestions"></div></section><p>Стартовые координаты от 1 до 10. После публикации пользователи смогут двигать точку голосами.</p><div class="coordinate-grid">
<label class="coordinate-control" style="--pole-color:#ee484a"><span>Кринж <output for="c0">5</output></span><input name="c0" type="range" min="1" max="10" value="5" style="accent-color:#ee484a"></label><label class="coordinate-control" style="--pole-color:#00d2dc"><span>База <output for="c1">5</output></span><input name="c1" type="range" min="1" max="10" value="5" style="accent-color:#00d2dc"></label><label class="coordinate-control" style="--pole-color:#3ece70"><span>Смешное <output for="c2">5</output></span><input name="c2" type="range" min="1" max="10" value="5" style="accent-color:#3ece70"></label><label class="coordinate-control" style="--pole-color:#d646d6"><span>Серьёзное <output for="c3">5</output></span><input name="c3" type="range" min="1" max="10" value="5" style="accent-color:#d646d6"></label><label class="coordinate-control" style="--pole-color:#4170ee"><span>Баян <output for="c4">5</output></span><input name="c4" type="range" min="1" max="10" value="5" style="accent-color:#4170ee"></label><label class="coordinate-control" style="--pole-color:#f0cd2c"><span>Новинка <output for="c5">5</output></span><input name="c5" type="range" min="1" max="10" value="5" style="accent-color:#f0cd2c"></label></div><button type="submit">Опубликовать</button><p id="message"></p><div class="form-links"><a href="./">Отмена</a></div></form></main><script src="form.js" defer></script></body></html>
