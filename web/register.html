<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация · Кринжевики</title><link rel="stylesheet" href="forms.css"></head>
<body><main class="form-page"><form class="form-card" data-kind="register" data-coordinates="true"><h1>Регистрация</h1><label>Логин<input name="username" minlength="3" maxlength="32" required autocomplete="username"></label><label>Пароль<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><p>Оцените себя по шести полюсам от 1 до 10.</p><div class="coordinate-grid">
<label>Кринж<input name="c0" type="number" min="1" max="10" value="5" required></label><label>База<input name="c1" type="number" min="1" max="10" value="5" required></label><label>Смешное<input name="c2" type="number" min="1" max="10" value="5" required></label><label>Серьёзное<input name="c3" type="number" min="1" max="10" value="5" required></label><label>Баян<input name="c4" type="number" min="1" max="10" value="5" required></label><label>Новинка<input name="c5" type="number" min="1" max="10" value="5" required></label></div><button type="submit">Создать аккаунт</button><p id="message"></p><div class="form-links"><a href="./">К карте</a><a href="login.html">Уже есть аккаунт</a></div></form></main><script src="form.js" defer></script></body></html>
