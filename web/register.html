<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация · Кринжевики</title><link rel="stylesheet" href="forms.css"></head>
<body><main class="form-page"><form class="form-card" data-kind="register" data-coordinates="true"><h1>Регистрация</h1><label>Логин<input name="username" minlength="3" maxlength="32" required autocomplete="username"></label><label>Пароль<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><p>Оцените себя по шести полюсам от 1 до 10.</p><div class="coordinate-grid">
<label class="coordinate-control" style="--pole-color:#ee484a"><span>Кринж <output for="c0">5</output></span><input name="c0" type="range" min="1" max="10" value="5" style="accent-color:#ee484a"></label><label class="coordinate-control" style="--pole-color:#00d2dc"><span>База <output for="c1">5</output></span><input name="c1" type="range" min="1" max="10" value="5" style="accent-color:#00d2dc"></label><label class="coordinate-control" style="--pole-color:#3ece70"><span>Смешное <output for="c2">5</output></span><input name="c2" type="range" min="1" max="10" value="5" style="accent-color:#3ece70"></label><label class="coordinate-control" style="--pole-color:#d646d6"><span>Серьёзное <output for="c3">5</output></span><input name="c3" type="range" min="1" max="10" value="5" style="accent-color:#d646d6"></label><label class="coordinate-control" style="--pole-color:#4170ee"><span>Баян <output for="c4">5</output></span><input name="c4" type="range" min="1" max="10" value="5" style="accent-color:#4170ee"></label><label class="coordinate-control" style="--pole-color:#f0cd2c"><span>Новинка <output for="c5">5</output></span><input name="c5" type="range" min="1" max="10" value="5" style="accent-color:#f0cd2c"></label></div><button type="submit">Создать аккаунт</button><p id="message"></p><div class="form-links"><a href="./">К карте</a><a href="login.html">Уже есть аккаунт</a></div></form></main><script src="form.js" defer></script></body></html>
